---
- name: Install NGINX
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Deploy application landing page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: "0644"

- name: Ensure NGINX is enabled and running
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
